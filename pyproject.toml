[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-enterprise-sso"
version = "0.1.0"
description = "Enterprise SSO integration layer for a multi-tenant SaaS: OAuth2/OIDC with PKCE, SAML 2.0 validation, SCIM 2.0 provisioning, tenant-scoped RBAC — all against fixture identity providers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
